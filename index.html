<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1-DRILL2</title>
    <style>
    h1
    {
    text-align: center; 
    color: rgb(27, 27, 98); 
    background-color: rgb(148, 202, 202);
    border: 1px; solid gray; 
    border-radius: 8px;
    }



    body
    {
    background-color: rgb(109, 169, 149);
    }

    .Hero
    {
    border: 1px; solid gray; border-radius: 8px;
    box-shadow: 0px 60px 5px 0px rgba(2,2,46,0.75);
    -webkit-box-shadow: 0px 0px 5px 0px rgba(2,2,46,0.75);
    -moz-box-shadow: 0px 60px 5px 0px rgba(2,2,46,0.75); 
    background-color: rgb(148, 202, 202);
    padding: 10px;
    width: 100%;
    height: 100%;
    }
    
    .Image
    {
    text-align: center;
    }

    footer
    {
    text-align: center; 
    padding: 10px; 
    background-color: rgb(148, 202, 202); 
    border: 1px; solid gray; 
    border-radius: 8px;
    }

    .extend
    {
    width: 100%;
    }

    </style>
</head>
<body>

    <h1>
    RATE A MOVIE
    </h1>

    <p>
    Share your top movie and give a review!
    </p>

    <div class="Hero">
    
    <div class="Image"><img src="https://png.pngtree.com/element_our/20190603/ourmid/pngtree-movie-board-icon-image_1455346.jpg" alt="Movie Image" width="100" height="100"></div>
        <br>
        <form action="">

        <div class="Image">
        <input class="extend" type="text" placeholder="Enter Your Movie's Title!">
        </div>
        <br>
        <fieldset class="extend">

            <legends>
            Genres Select: (select all that apply.)
            </legends>

            <br>

            <input type="checkbox"><label for="">Action</label>

            <input type="checkbox"><label for="">Comedy</label>

            <input type="checkbox"><label for="">Drama</label>

            <input type="checkbox"><label for="">Fantasy</label>

            <input type="checkbox"><label for="">Sci Fi</label>

        </fieldset>

        <br>

        <fieldset class="extend">

            <legends>
            Rating:
            </legends>

            <br>

            <input type="radio" ><label for=""> 
                ⭐️
                </label>

            <input type="radio"><label for="">
            ⭐️⭐️
            </label>

            <input type="radio">
            <label for="">
            ⭐️⭐️⭐️
            </label>

            <input type="radio">
            <label for="">
            ⭐️⭐️⭐️⭐️
            </label>

            <input type="radio">

            <label for="">
            ⭐️⭐️⭐️⭐️⭐️
            </label>

        </fieldset>

        <br>


        <textarea class="extend" name="" id="" placeholder="Write your Review!" rows="10" cols="50"></textarea>
        <br>
        <input type="submit" class="extend" value="Submit Your Review" >

        <br>
        Movie Review Tips: <a href="https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide">Click Here!</a>

        </form>
    </div>

    <br>

    <footer>
    © 2026 | Marti Lopido | 9-Topaz | Q1 DRILL 2
    </footer>
</body>
</html>
